name: private-archive-s3-tests

services:
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: private-archive-test
      AWS_SECRET_ACCESS_KEY: private-archive-test-secret
      S3_BUCKET: private-archive-test
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - s3-data:/data
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 15s

volumes:
  s3-data:
